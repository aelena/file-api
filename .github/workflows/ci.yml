name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '**/LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '**/LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:
  # Callable from release.yml, so a tag runs these exact gates rather than a
  # separate copy of them that can drift.
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # One SDK per target framework. .NET 11 is preview; when it is unavailable
      # the job fails loudly rather than quietly building only net10.0.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Aelena.FileApi.sln
          dotnet restore grpc/Aelena.FileApi.Grpc.sln

      # TreatWarningsAsErrors is on, so this is also the lint step.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Aelena.FileApi.sln -c Release --no-restore
          dotnet build grpc/Aelena.FileApi.Grpc.sln -c Release --no-restore

      # Runs each suite once per target framework: net10.0 and net11.0.
      - name: Test
        run: >
          dotnet test Aelena.FileApi.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Test (gRPC)
        run: >
          dotnet test grpc/Aelena.FileApi.Grpc.sln -c Release --no-build
          --logger "trx;LogFileName=grpc-test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          retention-days: 7

  packages:
    name: packages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Aelena.FileApi.Core/Aelena.FileApi.Core.csproj -c Release -o ./artifacts
          dotnet pack src/Aelena.FileApi.Core.Pdf/Aelena.FileApi.Core.Pdf.csproj -c Release -o ./artifacts
          dotnet pack src/Aelena.FileApi.Cli/Aelena.FileApi.Cli.csproj -c Release -o ./artifacts

      # The MIT package must never acquire an iText dependency. PDF lives in a
      # separate AGPL package for exactly this reason, and a stray ProjectReference
      # would silently pull copyleft code into every consumer of the MIT one — so
      # the boundary is asserted in CI rather than trusted to review.
      - name: Assert Aelena.FileApi.Core carries no iText dependency
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, re, sys, zipfile
          pkg = glob.glob("artifacts/Aelena.FileApi.Core.[0-9]*.nupkg")[0]
          z = zipfile.ZipFile(pkg)
          nuspec = next(n for n in z.namelist() if n.endswith(".nuspec"))
          xml = z.read(nuspec).decode("utf-8")
          deps = sorted(set(re.findall(r'<dependency id="([^"]+)"', xml)))
          licence = re.search(r'<license type="expression">(.*?)</license>', xml).group(1)
          # A package can carry iText without declaring it — a tool package
          # bundles its dependencies — so check the files as well as the deps.
          files = z.namelist()
          offenders = ([d for d in deps if "itext" in d.lower()]
                       + [f for f in files if "itext" in f.lower()])
          print(f"{pkg}\n  licence: {licence}\n  deps: {', '.join(deps)}")
          if licence != "MIT":
              sys.exit(f"::error::Expected MIT, found {licence}")
          if offenders:
              sys.exit(f"::error::MIT package depends on AGPL iText: {offenders}")
          print("OK: MIT package is free of iText")
          EOF

      # nuget.org refuses a package whose README is not plain UTF-8 text, and it
      # refuses it at push time — after the tag, after every other gate has
      # passed. That is the worst possible place to find out, so the same rule is
      # enforced here. 0.4.1 was rejected for a single 0x08 byte that reached the
      # file as an escape in a regex example; the C# compiled, because a verbatim
      # string accepts any character, so only a byte-level check catches it.
      - name: Assert every packed README is plain UTF-8 text
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile

          ALLOWED = {0x09, 0x0A, 0x0D}   # tab, newline, carriage return
          failed = False

          for pkg in sorted(glob.glob("artifacts/*.nupkg")):
              z = zipfile.ZipFile(pkg)
              readmes = [n for n in z.namelist() if n.lower().endswith("readme.md")]
              if not readmes:
                  print(f"{pkg}: no README packed")
                  continue

              for name in readmes:
                  raw = z.read(name)
                  try:
                      raw.decode("utf-8", errors="strict")
                  except UnicodeDecodeError as e:
                      print(f"::error::{pkg} ({name}) is not valid UTF-8: {e}")
                      failed = True
                      continue

                  bad = {b for b in raw if b < 0x20 and b not in ALLOWED} | {0x7F} & set(raw)
                  if bad:
                      where = next(i for i, b in enumerate(raw) if b in bad)
                      line = raw[:where].count(b"\n") + 1
                      print(f"::error::{pkg} ({name}) holds control byte(s) "
                            f"{sorted(hex(b) for b in bad)}, first at line {line}. "
                            "nuget.org will reject this package.")
                      failed = True
                      continue

                  print(f"OK: {pkg} ({name}) {len(raw)} bytes, plain UTF-8")

          sys.exit(1 if failed else 0)
          EOF

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*.*nupkg
          retention-days: 7

  # A cloner who cannot accept the AGPL is told to build -p:IncludePdf=false.
  # That promise is only worth making if it is checked, so it is built and the
  # published output inspected for an iText assembly on every push.
  no-pdf:
    name: MIT-only build (IncludePdf=false)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Build without PDF
        run: dotnet build Aelena.FileApi.sln -c Release -p:IncludePdf=false

      # The PDF endpoint tests are compiled out in this configuration; the rest
      # must still pass, so the opt-out is a supported build and not a broken one.
      - name: Test without PDF
        run: dotnet test Aelena.FileApi.sln -c Release --no-build -p:IncludePdf=false

      - name: Publish the API and CLI without PDF
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Aelena.FileApi.Api -f net10.0 -c Release -p:IncludePdf=false -o ./out/api
          dotnet publish src/Aelena.FileApi.Cli -f net10.0 -c Release -p:IncludePdf=false -o ./out/cli

      # Only iText's own assemblies indicate the AGPL dependency. BouncyCastle is
      # deliberately not matched: MimeKit pulls it in under MIT, so looking for it
      # reports a licence leak that is not one.
      - name: Assert no iText assembly reached the output
        shell: bash
        run: |
          found=$(find ./out -iname '*itext*' | head -20)
          if [ -n "$found" ]; then
            echo "::error::IncludePdf=false still shipped AGPL iText assemblies:"
            echo "$found"
            exit 1
          fi
          echo "OK: MIT-only output contains no iText assembly"

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      # The image pins the LTS runtime and publishes -f net10.0; this catches a
      # Dockerfile that has drifted from the project layout.
      - name: Build image
        run: docker build -f src/Aelena.FileApi.Api/Dockerfile -t fileapi:ci .
